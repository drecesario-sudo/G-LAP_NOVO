<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - G-LAP</title>
    <link rel="stylesheet" href="/assets/css/esqueci.css">
</head>
<body>
    <header>
        <img src="/assets/imgs/GLAPlogoSemfundo.png" id="g-lap-logo" alt="Logo G-LAP">
        <nav class="navbar">
            <ul class="menu">
                <li><a href="/index.html">Catálogo</a></li>
                <li><a href="/assets/paginas/login.html">Login</a></li>
                <li><a href="/assets/paginas/carrinho.html" class="carrinho-btn">🛒 Carrinho</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-container">
            <h2>Redefinir Senha</h2>
            <p>Digite seu e-mail e a nova senha desejada.</p>

            <form id="formEsqueci" class="login-form">
                <label for="emailRecuperar">E-mail da Conta</label>
                <input type="email" id="emailRecuperar" placeholder="Seu e-mail cadastrado" required>

                <label for="senhaNova">Nova Senha</label>
                <input type="password" id="senhaNova" placeholder="Digite a nova senha" required>

                <label for="senhaNovaRep">Repetir Nova Senha</label>
                <input type="password" id="senhaNovaRep" placeholder="Repita a nova senha" required>

                <button type="submit" class="login-btn">Atualizar Senha</button>

                <div class="links">
                    <a href="/assets/paginas/login.html">Voltar para Login</a>
                    <a href="/assets/paginas/cadastro.html">Criar nova conta</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        document.getElementById('formEsqueci').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailRecuperar').value;
            const novaSenha = document.getElementById('senhaNova').value;
            const repSenha = document.getElementById('senhaNovaRep').value;

            if (novaSenha !== repSenha) return alert("As senhas não conferem!");

            try {
                const resposta = await fetch('http://localhost:3000/api/clientes/reset-senha', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, novaSenha })
                });

                const resultado = await resposta.json();
                alert(resultado.mensagem);
                if (resposta.ok) window.location.href = 'login.html';
            } catch (erro) {
                alert("Erro ao processar solicitação.");
            }
        });
    </script>
</body>
</html>
