<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - G-LAP</title>
    <link rel="stylesheet" href="/assets/css/cadastro.css">
</head>
<body>
    <header>
        <img src="/assets/imgs/GLAPlogoSemfundo.png" id="g-lap-logo" alt="Logo G-LAP">
        <nav class="navbar">
            <ul class="menu">
                <li><a href="/index.html">Catálogo</a></li>
                <li><a href="/assets/paginas/login.html">Login</a></li>
                <li><a href="/assets/paginas/carrinho.html" class="carrinho-btn">🛒 Carrinho</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-container">
            <h2>Cadastre-se</h2>
            <p>Bem-vindo! Faça seu cadastro para iniciar suas compras.</p>

            <form id="formCadastro" class="login-form">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>

                <label for="confSenha">Confirmação de Senha</label>
                <input type="password" id="confSenha" placeholder="Repita sua senha" required>

                <button type="submit" class="login-btn">Criar Conta</button>

                <div class="links">
                    <a href="/assets/paginas/login.html">Já tem conta? Faça Login</a>
                </div>
            </form>
        </section>
    </main>
    
    <footer>
        <p>© 2025 G-LAP Informática — Todos os direitos reservados</p>
    </footer>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const confSenha = document.getElementById('confSenha').value;

            if (senha !== confSenha) {
                return alert("As senhas não coincidem!");
            }

            try {
                const resposta = await fetch('http://localhost:3000/api/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                const resultado = await resposta.json();
                if (resposta.ok) {
                    alert("Cadastro realizado com sucesso!");
                    window.location.href = 'login.html';
                } else {
                    alert(resultado.mensagem);
                }
            } catch (erro) {
                alert("Erro ao conectar com o servidor.");
            }
        });
    </script>
</body>
</html>
