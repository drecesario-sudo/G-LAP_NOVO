<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - G-LAP</title>
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
    <header>
        <img src="/assets/imgs/GLAPlogoSemfundo.png" id="g-lap-logo" alt="Logo G-LAP">
        <nav class="navbar">
            <ul class="menu">
                <li><a href="/index.html">Catálogo</a></li>
                <li><a href="/assets/paginas/login.html">Login</a></li>
                <li><a href="/assets/paginas/carrinho.html" class="carrinho-btn">🛒 Carrinho</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-container">
            <h2>Entrar na sua conta</h2>
            <p>Bem-vindo de volta! Faça login para continuar comprando.</p>

            <form action="#" method="post" class="login-form">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="new-password">

                <button type="submit" class="login-btn">Entrar</button>

                <div class="links">
                    <a href="/assets/paginas/esqueci.html">Esqueceu a senha?</a>
                    <a href="/assets/paginas/cadastro.html">Criar nova conta</a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 G-LAP Informática — Todos os direitos reservados</p>
    </footer>

    <script>
    const loginForm = document.querySelector('.login-form');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        try {
            // URL da sua API no outro ambiente/pasta
            const resposta = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            const resultado = await resposta.json();

            if (resposta.ok) {
                // Salva os dados retornados pela sua API
                localStorage.setItem('glap_token', resultado.token);
                localStorage.setItem('glap_user', resultado.cliente);

                alert(`Bem-vindo, ${resultado.cliente}!`);
                
                // Redireciona de forma inteligente
                window.location.href = document.referrer.includes('carrinho.html') 
                    ? 'carrinho.html' 
                    : '../../index.html';
            } else {
                alert(resultado.mensagem || "Erro no login");
            }
        } catch (erro) {
            alert("Não foi possível conectar ao servidor de autenticação.");
        }
    });
</script>
</body>
</html>
